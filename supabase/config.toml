project_id = "squad-beacon"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["squadbeacon://auth/callback"]
enable_signup = true
minimum_password_length = 10
[auth.email]
enable_signup = true
enable_confirmations = true
[functions.push-worker]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
