<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f6f7;color:#17202a;font-family:Arial,sans-serif">
    <main style="max-width:440px;margin:32px auto;padding:28px;background:#fff;border-radius:16px">
      <h1 style="font-size:24px">Reset your Squad Beacon password</h1>
      <p style="font-size:16px;line-height:1.6">Continue to a secure Squad Beacon page to confirm this request and choose a new password.</p>
      <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:14px 20px;background:#29323a;color:#fff;text-decoration:none;border-radius:12px;font-weight:bold">Continue to password reset</a></p>
      <p style="font-size:14px;line-height:1.6">Your password has not changed. If you didn’t request this email, you can ignore it.</p>
    </main>
  </body>
</html>
