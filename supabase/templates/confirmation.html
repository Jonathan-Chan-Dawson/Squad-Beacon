<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f6f7;color:#17202a;font-family:Arial,sans-serif">
    <main style="max-width:440px;margin:32px auto;padding:28px;background:#fff;border-radius:16px">
      <h1 style="font-size:24px">Confirm your Squad Beacon account</h1>
      <p style="font-size:16px;line-height:1.6">One quick confirmation, then you can finish the basics and start making plans.</p>
      <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 20px;background:#29323a;color:#fff;text-decoration:none;border-radius:12px;font-weight:bold">Confirm email</a></p>
      <p style="font-size:14px;line-height:1.6">You’ll confirm on a secure Squad Beacon page. If you didn’t create an account, you can ignore this email.</p>
    </main>
  </body>
</html>
